name: Reusable Deploy 
on: 
  workflow_call:
    inputs:
      artifact-name:
        description: The name of the deploable artifact files 
        required: false
        default: dist
        type: string
jobs:
  deploy: 
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: acttions/download-artifacrt@v4
        with:
          name: ${{ inputs.artifact-name }}
      - name: List files
        run: ls
      - name: Output information
        run: echo "Deploying & Upload""